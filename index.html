<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rail-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rail Samanvay — AI-powered block scheduling optimization for Indian Railways" />
    <meta name="theme-color" content="#e9ecf0" />
    <title>Niyojan AI | Block Scheduling AI Brain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong lamp state.
      // Default is light — this is the primary viewing mode, with dark available.
      (function () {
        try {
          var t = localStorage.getItem('rs_theme');
          document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content',
            t === 'dark' ? '#141210' : '#e9ecf0'
          );
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
